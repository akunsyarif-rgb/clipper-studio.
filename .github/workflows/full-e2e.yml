name: Full browser regression

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "e2e/**"
      - "remotion/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "playwright.config.*"
      - ".github/workflows/full-e2e.yml"
  workflow_dispatch:

concurrency:
  group: full-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright for E2E
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Run complete browser regression suite
        run: npm run test:e2e
