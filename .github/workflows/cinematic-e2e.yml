name: Cinematic E2E

on:
  pull_request:
    paths:
      - "app/CinematicStudio.tsx"
      - "app/motion/page.tsx"
      - "lib/cinematic.ts"
      - "lib/session.ts"
      - "lib/session-store.ts"
      - "e2e/cinematic.mjs"
      - ".github/workflows/cinematic-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/CinematicStudio.tsx"
      - "app/motion/page.tsx"
      - "lib/cinematic.ts"
      - "lib/session.ts"
      - "lib/session-store.ts"
      - "e2e/cinematic.mjs"
      - ".github/workflows/cinematic-e2e.yml"

jobs:
  cinematic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install dependencies
        run: npm ci
      # Playwright is only used by the browser regression suite; keep it out of the shipped app dependencies.
      - name: Install Playwright for E2E
        # Installed outside the project tree: installing into it with --no-save crashes npm ("reading 'edgesOut'").
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pw/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Run Cinematic end-to-end test
        run: node e2e/cinematic.mjs
