name: Cinematic E2E

on:
  pull_request:
    paths:
      - "app/CinematicStudio.tsx"
      - "app/motion/page.tsx"
      - "lib/cinematic.ts"
      - "lib/session.ts"
      - "lib/session-store.ts"
      - "e2e/cinematic.mjs"
      - ".github/workflows/cinematic-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/CinematicStudio.tsx"
      - "app/motion/page.tsx"
      - "lib/cinematic.ts"
      - "lib/session.ts"
      - "lib/session-store.ts"
      - "e2e/cinematic.mjs"
      - ".github/workflows/cinematic-e2e.yml"

jobs:
  cinematic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Run Cinematic end-to-end test
        run: node e2e/cinematic.mjs
